# Builds the Windows app (FileOrganiser.exe, FileOrganiserSetup.exe) and the
# Mac app (FileOrganiser-mac.dmg), and checks each one actually opens.
#
# Every push builds and tests both, without publishing anything.
# Push a tag like v1.4 to also publish them as a GitHub Release:
#     git tag v1.4
#     git push origin v1.4
# The tag must match __version__ in organiser/__init__.py, and the release
# notes come from the "## v1.4" section of CHANGELOG.md.

name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import organiser; print(organiser.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match organiser/__init__.py ($version). Update __version__ first."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: '"APP_VERSION=${{ github.ref_name }}".Replace("=v", "=") >> $env:GITHUB_ENV'

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Check the built app opens
        shell: pwsh
        run: |
          $run = Start-Process dist\FileOrganiser.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "The built app failed its smoke test (exit $($run.ExitCode))." }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/FileOrganiser.exe
            dist/FileOrganiserSetup.exe

  mac:
    runs-on: macos-latest  # Apple silicon
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Tk is there
        run: python -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import organiser; print(organiser.__version__)")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match organiser/__init__.py ($version)."
            exit 1
          fi

      - name: Build
        env:
          PYTHON: python
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            export APP_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          set +e
          sh build_mac.sh > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            echo "::error::Mac build failed (exit $code): $(tail -c 1500 build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Check the built app opens
        run: |
          set +e
          "dist/File Organiser.app/Contents/MacOS/File Organiser" --smoke-test > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ $code -ne 0 ]; then
            echo "::error::Mac smoke test failed (exit $code): $(tail -c 900 smoke.log | tr '\n' ' ')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/FileOrganiser-mac.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          python3 scripts/release_notes.py "${{ github.ref_name }}" > notes.md
          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no '## ${{ github.ref_name }}' section; using commit titles."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileOrganiser.exe
            dist/FileOrganiserSetup.exe
            dist/FileOrganiser-mac.dmg
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
