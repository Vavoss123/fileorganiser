# Builds FileOrganiser.exe and FileOrganiserSetup.exe on Windows.
#
# Push a tag like v1.2 to publish them as a GitHub Release:
#     git tag v1.2
#     git push origin v1.2
# Running it by hand from the Actions tab builds them without releasing;
# the files are then under the run's "Artifacts".

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: '"APP_VERSION=${{ github.ref_name }}".Replace("=v", "=") >> $env:GITHUB_ENV'

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import organiser; print(organiser.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match organiser/__init__.py ($version). Update __version__ first."
          }

      - name: Build
        shell: cmd
        run: call build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: FileOrganiser
          path: |
            dist/FileOrganiser.exe
            dist/FileOrganiserSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileOrganiser.exe
            dist/FileOrganiserSetup.exe
          generate_release_notes: true
